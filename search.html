---
layout: default
title: Cerca nel blog
---

<section class="search-page reading-width" aria-labelledby="search-title">
  <p class="eyebrow">Tra le righe / Ricerca</p>
  <h1 id="search-title">Cerca tra gli appunti.</h1>
  <p id="search-summary" class="search-summary" role="status">Usa il campo di ricerca in fondo alla pagina.</p>
  <ul id="search-results"></ul>
  <noscript>La ricerca richiede JavaScript. Puoi comunque <a href="{{ '/' | relative_url }}">sfogliare tutti gli articoli</a>.</noscript>
</section>

<script>
  window.store = {
    {% for post in site.posts %}
      {{ post.url | jsonify }}: {
        "title": {{ post.title | strip_html | jsonify | replace: '<', '\u003c' }},
        "content": {{ post.content | strip_html | normalize_whitespace | jsonify | replace: '<', '\u003c' }},
        "url": {{ post.url | relative_url | jsonify }},
        "lang": {{ post.lang | default: site.lang | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
</script>
<script defer src="{{ '/public/js/lunr.min.js' | relative_url }}"></script>
<script defer src="{{ '/public/js/search.js' | relative_url }}"></script>
