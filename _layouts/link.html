    <a class="back-link" href="{{ '/' | relative_url }}" lang="it">← Tutti gli appunti</a>
    {% include post-meta.html post=page %}
    <h1 class="post-title"><a href="{{ page.origlink | escape }}">{{ page.title }} <span class="external-arrow" aria-hidden="true">↗</span></a></h1>
    <a class="source-link" href="{{ page.origlink | escape }}" lang="it">Leggi alla fonte <span aria-hidden="true">↗</span></a>

    {{ content }}
  </div>
</article>
